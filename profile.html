<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>InHome Prospect Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --red:#FF0000; --paper:#000; --card:#141414; --card2:#1C1C1C; --line:#2E2E2E; --ink:#F5F5F5; --mute:#A0A0A0; --dim:#6A6A6A; --good:#35C759; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:680px; margin:0 auto; padding:0 18px 70px;}
  .top{display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--line);}
  .top img{height:32px; width:auto;}
  .top .tag{font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); font-weight:800;}

  .hero{display:flex; gap:16px; align-items:center; padding:22px 0 14px;}
  .face{width:104px; height:104px; border-radius:16px; background:var(--card2); border:1px solid var(--line); overflow:hidden;
        display:grid; place-items:center; font-family:'Anton',sans-serif; font-size:34px; color:var(--dim); flex:0 0 auto;}
  .face img{width:100%; height:100%; object-fit:cover;}
  h1{font-family:'Anton',sans-serif; font-weight:400; font-size:32px; line-height:1.05; margin:0 0 5px;}
  .sub{color:var(--mute); font-size:13px;}
  .sub img{width:15px; height:15px; object-fit:contain; vertical-align:-3px; margin-right:4px;}
  .score{display:flex; gap:10px; align-items:baseline; margin-top:8px;}
  .score .n{font-family:'Anton',sans-serif; font-size:30px; color:var(--red); line-height:1;}
  .score .l{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); font-weight:700;}

  .kv{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px; margin:14px 0 4px;}
  .kv div{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 11px;}
  .kv .k{font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); font-weight:700;}
  .kv .v{font-size:14.5px; font-weight:700; margin-top:2px;}
  .vchk{display:inline-flex; align-items:center; justify-content:center; width:13px; height:13px; border-radius:50%;
        background:#1D9BF0; color:#fff; font-size:8px; font-weight:900; margin-left:4px; vertical-align:1px;}

  h2{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); font-weight:800; margin:26px 0 8px;}
  .row{display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line); font-size:13.5px;}
  .row:first-of-type{border-top:none;}
  .pill{display:inline-block; font-size:11px; font-weight:700; border:1px solid var(--line); border-radius:999px; padding:4px 10px; margin:0 6px 6px 0; color:var(--ink);}
  .pill.commit{border-color:var(--good); color:var(--good);}
  /* personality */
  .pt{border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--card);}
  .pt-head{display:flex; gap:12px; align-items:center; margin-bottom:12px;}
  .pt-type{font-family:'Anton',sans-serif; font-size:30px; letter-spacing:.04em; line-height:1; flex:0 0 auto;}
  .pt-name{font-weight:700; font-size:15px;}
  .pt-letters{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px;}
  .pt-letters div{background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:8px 8px 7px; min-width:0;}
  .pt-letters b{font-family:'Anton',sans-serif; font-size:16px; display:block; line-height:1;}
  .pt-letters span{display:block; font-size:9px; letter-spacing:.09em; text-transform:uppercase; color:var(--dim); font-weight:700; margin-top:3px;}
  .pt-letters small{display:block; font-size:10px; color:#C4C4C4; line-height:1.35; margin-top:4px;}
  .pt-k{font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim); font-weight:700; margin-bottom:5px;}
  .pt p{font-size:13.5px; line-height:1.55; color:#DADADA; margin:0 0 12px;}
  .pt-cols{display:grid; grid-template-columns:1fr; gap:12px;}
  @media(min-width:640px){ .pt-cols{grid-template-columns:1fr 1fr 1fr;} }
  .pt-cols ul{margin:0; padding-left:16px;}
  .pt-cols li{font-size:12.5px; line-height:1.45; color:#DADADA; margin-bottom:4px;}
  .played{font-size:12px; color:#C4C4C4; margin-top:2px;}
  .unlock{border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--card); margin-top:18px;}
  .iq{border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--card);}
  .iq-top{display:flex; gap:16px; align-items:center; margin-bottom:12px;}
  .iq-big{font-family:'Anton',sans-serif; font-size:34px; line-height:1;}
  .iq-track{flex:1; height:8px; background:#2A2A2A; border-radius:5px; overflow:hidden;}
  .iq-fill{height:100%; background:#F5F5F5;}
  .iq-cats{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .iq-cat{border:1px solid var(--line); border-radius:7px; padding:5px 9px; font-size:11.5px; display:flex; gap:7px; align-items:baseline;}
  .iq-cat b{font-weight:600;} .iq-cat span{color:var(--dim); font-weight:700;}
  .iq-cat.hi{border-color:var(--good);} .iq-cat.lo{border-color:#FF4D4D;}
  .iq-p{font-size:13.5px; line-height:1.55; color:#DADADA; margin:0 0 8px;}
  .iq-about{border-top:1px solid var(--line); padding-top:10px; margin-top:6px;}
  .iq-about p{font-size:12.5px; line-height:1.55; color:#9A9A9A; margin:0 0 7px;}
  /* full assessment */
  .fq{border:1px solid var(--line); border-left-width:3px; border-radius:10px; padding:11px 13px; margin-bottom:8px; background:var(--card);}
  .fq.ok{border-left-color:var(--good);} .fq.no{border-left-color:#FF4D4D;}
  .fq-top{display:flex; gap:9px; align-items:flex-start;}
  .fq-n{font-family:'Anton',sans-serif; font-size:13px; color:var(--dim); min-width:18px;}
  .fq-q{flex:1; font-size:13.5px; font-weight:600; line-height:1.4;}
  .fq-mark{font-size:10.5px; font-weight:800; letter-spacing:.06em; white-space:nowrap;}
  .fq.ok .fq-mark{color:var(--good);} .fq.no .fq-mark{color:#FF4D4D;}
  .fq-ans{font-size:12.5px; margin-top:6px; padding-left:27px; color:#DADADA;}
  .fq-ans .k{font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); font-weight:700; margin-right:6px;}
  .fq-why{font-size:12px; color:#9A9A9A; line-height:1.45; margin-top:6px; padding-left:27px;}
  .wq{margin-bottom:12px;}
  .wq-q{font-size:12.5px; font-weight:700; color:#C4C4C4; line-height:1.4;}
  .wq-a{font-size:13.5px; line-height:1.55; color:#EDEDED; margin-top:4px; padding-left:11px; border-left:2px solid var(--line); white-space:pre-wrap;}
  .offers{display:flex; flex-wrap:wrap; gap:7px; margin-top:4px;}
  .offer-chip{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:9px;
      padding:6px 10px 6px 7px; background:var(--card); max-width:100%;}
  .offer-chip img{width:22px; height:22px; object-fit:contain; flex:0 0 auto;}
  .offer-chip .offer-fb{width:22px; height:22px; border-radius:5px; flex:0 0 auto; display:grid; place-items:center;
      font-family:'Anton',sans-serif; font-size:10px;}
  .offer-chip b{font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .offer-chip .offer-yr{font-size:10.5px; color:var(--dim); white-space:nowrap;}
  .offer-chip.committed{border-color:var(--good);}
  .commit-line{display:flex; align-items:center; gap:9px; margin-bottom:8px;}
  .commit-line img{width:30px; height:30px; object-fit:contain;}
  .commit-st{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); font-weight:700;}
  .commit-to{font-family:'Anton',sans-serif; font-size:17px; line-height:1.1;}
  .narr{background:var(--card); border-left:2px solid var(--red); border-radius:0 10px 10px 0; padding:11px 13px; font-size:13.5px; color:#D6D6D6; white-space:pre-wrap;}

  .rail{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .rlink{display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 11px; border:1px solid var(--line);
         border-radius:9px; background:var(--card); text-decoration:none;}
  .rlink:hover{border-color:var(--ink); background:var(--card2);}
  .rlink img{height:15px; width:auto; max-width:60px; object-fit:contain;}
  .rlink span{font-size:11px; font-weight:700; color:var(--mute);}
  .btn{display:block; text-align:center; background:var(--red); color:#fff; text-decoration:none; border-radius:11px;
       padding:14px; font-family:'Anton',sans-serif; font-size:16px; letter-spacing:.05em; text-transform:uppercase; margin-top:10px;}
  .btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line); font-family:'Inter',sans-serif;
             font-size:13px; font-weight:700; letter-spacing:0; text-transform:none;}
  footer{border-top:1px solid var(--line); margin-top:32px; padding:18px 0 40px; font-size:11.5px; color:var(--dim); line-height:1.7;}
  .empty{text-align:center; padding:70px 0;}
  .empty .big{font-family:'Anton',sans-serif; font-size:30px; margin-bottom:10px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img src="inhome-logo.png" alt="InHome Recruiting Intelligence">
    <span class="tag">Prospect Profile</span>
  </div>
  <div id="app"><div class="empty"><div class="big">Loading&hellip;</div></div></div>
</div>

<script>
const esc = (s) => String(s==null?'':s).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
/* Offer as a crest. Uses the logoUrl and colour player.js attaches from the
   programs table; a school not in that table gets a colour block with
   initials, text flipped by luminance so a light gold stays readable. */
function onColor(hex){
  const c = String(hex||'').replace('#',''); if(c.length!==6) return '#fff';
  const n = parseInt(c,16); const L=[(n>>16)&255,(n>>8)&255,n&255].map(v=>{v/=255; return v<=.03928? v/12.92 : Math.pow((v+.055)/1.055,2.4)});
  return (.2126*L[0]+.7152*L[1]+.0722*L[2]) > 0.45 ? '#0A0A0A' : '#FFFFFF';
}
function offerChip(o, commitment){
  const name = o.school || '';
  const isCommit = commitment && commitment.to && name && String(commitment.to).toLowerCase() === String(name).toLowerCase();
  const init = name.split(/\s+/).map(w=>w[0]||'').join('').slice(0,3).toUpperCase();
  const bg = o.color || '#555';
  const mark = o.logoUrl
    ? `<img src="${esc(o.logoUrl)}" alt="" onerror="this.outerHTML='<span class=&quot;offer-fb&quot; style=&quot;background:${esc(bg)};color:${onColor(bg)}&quot;>${esc(init)}</span>'">`
    : `<span class="offer-fb" style="background:${esc(bg)};color:${onColor(bg)}">${esc(init)}</span>`;
  const yr = o.date ? String(o.date).slice(0,4) : '';
  return `<span class="offer-chip${isCommit?' committed':''}" title="${esc(name)}${o.date?' \u00b7 '+esc(o.date):''}">${mark}<b>${esc(name)}</b>${yr?`<span class="offer-yr">${yr}</span>`:''}</span>`;
}
const QS = new URLSearchParams(location.search);

const profileSearch = (path, n) => 'https://www.google.com/search?q=' + encodeURIComponent(`site:${path} "${n}"`);
const SITES = [
  { name:'247Sports', domain:'247sports.com', url:n => profileSearch('247sports.com/player/', n) },
  { name:'On3',       domain:'on3.com',       url:n => profileSearch('on3.com/db/', n) },
  { name:'Rivals',    domain:'rivals.com',    url:n => profileSearch('on3.com/rivals/', n) },
  { name:'MaxPreps',  domain:'maxpreps.com',  url:n => profileSearch('maxpreps.com/athlete/', n) },
  { name:'MileSplit', domain:'milesplit.com', url:n => profileSearch('milesplit.com/athletes/', n) },
  { name:'Hudl',      domain:'hudl.com',      url:n => profileSearch('hudl.com/profile/', n) },
  { name:'X',         domain:'x.com',         url:n => 'https://x.com/search?f=live&q=' + encodeURIComponent(`"${n}"`) }
];
const icon = d => 'https://www.google.com/s2/favicons?sz=64&domain=' + d;
function railHTML(name){
  if(!name) return '';
  return '<div class="rail">' + SITES.map(s =>
    `<a class="rlink" href="${s.url(name)}" target="_blank" rel="noopener" title="${s.name}">
       <img src="${icon(s.domain)}" alt="" onerror="this.remove()"><span>${s.name}</span></a>`).join('') + '</div>';
}

function render(p){
  const v = p.verifications || {};
  const chk = f => v[f] ? `<span class="vchk" title="Verified by InHome${v[f].source?' \u00b7 '+esc(v[f].source):''}">&#10003;</span>` : '';
  const kv = [
    ['Position', p.positionLabel || p.position],
    ['Class', p.classYear ? 'Class of ' + p.classYear : null],
    ['Level', p.level],
    ['Height', p.height ? esc(p.height) + chk('height') : null],
    ['Weight', p.weight ? esc(p.weight) + chk('weight') : null],
    ['Wingspan', p.wingspan ? esc(p.wingspan) + chk('wingspan') : null],
    ['Track', v.track ? esc(v.track.value || 'verified') + chk('track') : null],
    ['40', v.forty ? esc(v.forty.value || 'verified') + chk('forty') : null],
    ['GPA', v.gpa ? esc(v.gpa.value || 'verified') + chk('gpa') : null],
    ['Hometown', [p.homeCity, p.homeState].filter(Boolean).join(', ') || null]
  ].filter(x => x[1]);

  const best = (p.reports||[]).length ? p.reports.reduce((a,b)=>((b.score||0)>(a.score||0)?b:a)) : null;
  const graded = (p.games||[]).filter(g => g.grade != null);

  /* film + socials the athlete or our staff actually supplied */
  const links = [
    ['Hudl', p.hudlLink, 'hudl.com'],
    ['MileSplit', p.milesplitLink, 'milesplit.com'],
    ['Film', p.filmLink, 'youtube.com'],
    ['X', p.xLink, 'x.com'],
    ['Instagram', p.igLink, 'instagram.com']
  ].filter(x => x[1]);

  let h = `
    <div class="hero">
      <div class="face">${p.headshotUrl ? `<img src="${esc(p.headshotUrl)}" alt="">` : esc((p.name||'?').split(' ').map(w=>w[0]).join('').slice(0,2))}</div>
      <div style="flex:1;min-width:0;">
        <h1>${esc(p.name)}</h1>
        <div class="sub">${p.logoUrl?`<img src="${esc(p.logoUrl)}" alt="" onerror="this.remove()">`:''}${esc(p.school||'')}</div>
        ${best ? `<div class="score"><span class="n">${best.score!=null?best.score.toFixed(1):'\u2014'}</span><span class="l">InHome Score${best.tier?' \u00b7 '+esc(best.tier):''}</span></div>`
               : `<div class="sub" style="margin-top:8px;color:var(--dim)">Evaluation in progress</div>`}
      </div>
    </div>
    <div class="kv">${kv.map(x=>`<div><div class="k">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('')}</div>`;

  if(p.commitment || (p.offers||[]).length){
    h += `<h2>Recruitment</h2>`;
    if(p.commitment){
      h += `<div class="commit-line">${p.commitment.logoUrl?`<img src="${esc(p.commitment.logoUrl)}" alt="" onerror="this.remove()">`:''}`
         + `<div><div class="commit-st">${esc(p.commitment.status)}${p.commitment.date?' \u00b7 '+esc(p.commitment.date):''}</div>`
         + (p.commitment.to?`<div class="commit-to">${esc(p.commitment.to)}</div>`:'') + `</div></div>`;
    }
    if((p.offers||[]).length){
      h += `<div class="offers">${p.offers.map(o=>offerChip(o, p.commitment)).join('')}</div>`;
    } else h += `<div class="sub">No offers logged yet.</div>`;
  }

  if(links.length){
    h += `<h2>Film and socials</h2><div class="rail">` + links.map(l =>
      `<a class="rlink" href="${esc(l[1])}" target="_blank" rel="noopener"><img src="${icon(l[2])}" alt="" onerror="this.remove()"><span>${l[0]}</span></a>`).join('') + `</div>`;
  }

  /* Soft profile: invite a staff to unlock the rest with their access code.
     The code is remembered for the session so a coach opening several
     profiles enters it once. */
  if(!p.fullProfile){
    h += `<div class="unlock" id="unlock">
      <div class="pt-k">College staff and InHome scouts</div>
      <div style="font-size:13.5px;line-height:1.55;color:#DADADA;margin-bottom:10px;">Enter your InHome access code to see the full profile: scouting reports, the Football IQ assessment question by question, his written interview answers, and the personality read.</div>
      <form id="unlockForm" style="display:flex;gap:8px;">
        <input type="text" id="unlockCode" placeholder="ACCESS CODE" autocomplete="off" spellcheck="false" style="flex:1;min-width:0;padding:12px 13px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:15px;letter-spacing:.14em;text-transform:uppercase;">
        <button type="submit" style="padding:12px 16px;border-radius:9px;border:none;background:#F5F5F5;color:#0A0A0A;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;">Unlock</button>
      </form>
      <div id="unlockErr" style="color:#FF7D7D;font-size:12.5px;min-height:16px;margin-top:6px;">${p.viewer===null && QS.get('code') ? 'That code was not recognized.' : ''}</div>
    </div>`;
  }

  if(p.fullProfile && (p.reports||[]).length){
    h += `<h2>Scouting reports (${p.reports.length})</h2>` + p.reports.map(r => `
      <div class="row"><div style="flex:1;"><b>${esc(r.scoutName||'InHome Scout')}</b>${r.scoutRole?` <span class="sub">\u00b7 ${esc(r.scoutRole)}</span>`:''}
        ${r.scoutPlayed?`<div class="played">${esc(r.scoutPlayed)}</div>`:''}
        <div class="sub">${esc(r.date||'')}${r.archetype?' \u00b7 '+esc(r.archetype):''}</div></div>
        <div style="text-align:right;"><div style="font-family:'Anton',sans-serif;font-size:19px;">${r.score!=null?r.score.toFixed(1):'\u2014'}</div>
        <div class="sub" style="font-size:10.5px;">${esc(r.tier||'')}</div></div></div>`).join('');
    const withNarr = p.reports.find(r => r.narrative);
    if(withNarr) h += `<div class="narr" style="margin-top:10px;">${esc(withNarr.narrative)}</div>`;
  }

  if((p.assessments||[]).length){
    h += `<h2>Assessments</h2>` + p.assessments.map(a => `
      <div class="row"><div style="flex:1;"><b>${a.kind==='iq'?'Football IQ':a.kind==='full'?'Athlete Assessment':'Athlete Interview'}</b>
        <div class="sub">${esc(a.completed||'')}${a.mbti?' \u00b7 '+esc(a.mbti):''}${a.total!=null?' \u00b7 '+a.correct+' of '+a.total:''}</div>
        ${a.diagnosis?`<div class="sub" style="color:#C4C4C4;margin-top:4px;">${esc(a.diagnosis.summary)}</div>`:''}</div>
        ${a.pct!=null?`<div style="font-family:'Anton',sans-serif;font-size:19px;">${a.pct}%</div>`:''}</div>`).join('');

    /* Personality, explained. Shown on every profile that has a type. */
    const withType = p.assessments.find(a => a.personality);
    if(withType){
      const t = withType.personality;
      h += `<h2>Personality</h2>
        <div class="pt">
          <div class="pt-head"><span class="pt-type">${esc(t.type)}</span><div><div class="pt-name">${esc(t.name)}</div><div class="sub">${esc(t.line)}</div></div></div>
          <div class="pt-letters">${t.letters.map(l => `<div><b>${esc(l.letter)}</b><span>${esc(l.word)}</span><small>${esc(l.gloss)}</small></div>`).join('')}</div>
          <div class="pt-k">In a college locker room</div>
          <p>${esc(t.room)}</p>
          <div class="pt-cols">
            <div><div class="pt-k">What you get</div><ul>${t.strengths.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
            <div><div class="pt-k">Where it goes sideways</div><ul>${t.watch.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
            <div><div class="pt-k">How to coach him</div><ul>${t.coach.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
          </div>
          <div class="sub" style="margin-top:10px;color:var(--dim);">From a forced-choice inventory the athlete completed himself. A tendency, not a verdict, and it never touches the InHome Score.</div>
        </div>`;
    }

    /* Full assessment. Every scored question with his answer, the right
       answer and the reason, then his written answers verbatim. */
    if(p.fullProfile){
      p.assessments.filter(a => (a.detail && a.detail.length) || (a.written && a.written.length)).forEach(a => {
        const scored = a.detail || [];
        if(scored.length){
          const right = scored.filter(d=>d.correct).length;
          const dg = a.diagnosis || {};
          const cats = dg.categories || [];
          h += `<h2>Football IQ</h2>
            <div class="iq">
              <div class="iq-top">
                <div><div class="iq-big">${a.pct!=null?a.pct+'%':'\u2014'}</div><div class="sub">${right} of ${scored.length} scored questions${dg.band?' \u00b7 '+esc(dg.band):''}</div></div>
                <div class="iq-track"><div class="iq-fill" style="width:${a.pct||0}%"></div></div>
              </div>
              ${cats.length ? `<div class="iq-cats">${cats.map(c=>`<div class="iq-cat ${c.pct>=80?'hi':c.pct<60?'lo':''}"><b>${esc(c.name)}</b><span>${c.correct}/${c.total}</span></div>`).join('')}</div>` : ''}
              ${dg.summary ? `<p class="iq-p">${esc(dg.summary)}</p>` : ''}
              ${dg.profile ? `<p class="iq-p">${esc(dg.profile)}</p>` : ''}
              <div class="iq-about">
                <div class="pt-k">What this grade is</div>
                <p>The athlete completed this himself. He watched real film clips and diagnosed them, answered written football questions on formations, coverages and run fits, and read live plays on a field diagram. Film and multiple-choice items are auto-scored against a key he never sees. It is a measure of what he can recognize and explain right now, not a projection.</p>
                <p>It is separate from the Football IQ gauge on the scouting report, which is the scout's read from tape. When the two agree you have a confident number. When they disagree, the question by question below usually shows why.</p>
              </div>
            </div>`;
          h += `<h2>Question by question <span class="sub" style="text-transform:none;letter-spacing:0;font-weight:400;">${right} of ${scored.length} right</span></h2>`;
          h += scored.map((d,i) => `
            <div class="fq ${d.correct?'ok':'no'}">
              <div class="fq-top"><span class="fq-n">${i+1}</span><span class="fq-q">${esc(d.q)}</span><span class="fq-mark">${d.correct?'\u2713 Right':'\u2717 Missed'}</span></div>
              <div class="fq-ans"><span class="k">He answered</span> ${esc(String(d.given ?? '\u2014'))}</div>
              ${d.correct ? '' : `<div class="fq-ans"><span class="k">Right answer</span> ${esc(String(d.answer ?? '\u2014'))}</div>`}
              ${d.why ? `<div class="fq-why">${esc(d.why)}</div>` : ''}
            </div>`).join('');
        }
        const written = a.written || [];
        if(written.length){
          h += `<h2>Interview, in his words</h2>`;
          let lastSec = null;
          written.forEach(w => {
            if(w.section && w.section !== lastSec){ h += `<div class="pt-k" style="margin-top:12px;">${esc(w.section)}</div>`; lastSec = w.section; }
            h += `<div class="wq"><div class="wq-q">${esc(w.q)}</div><div class="wq-a">${esc(w.text)}</div></div>`;
          });
        }
      });
      const who = p.viewer ? (p.viewer.program ? ' for ' + esc(p.viewer.program) : p.viewer.scout ? ' for ' + esc(p.viewer.scout) + ' (InHome)' : '') : '';
      h += `<div class="sub" style="margin-top:14px;color:var(--dim);">Full profile unlocked${who}. Shared with the athlete's consent for recruiting evaluation. Please keep it within your staff.</div>`;
    }
  }

  if((p.notes||[]).length){
    h += `<h2>InHome notes</h2>` + p.notes.map(n => `
      <div style="padding:9px 0;border-top:1px solid var(--line);">
        <div class="sub" style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;">${esc(n.kind)}${n.date?' \u00b7 '+esc(n.date):''}</div>
        <div style="font-size:13.5px;color:#D6D6D6;white-space:pre-wrap;margin-top:3px;">${esc(n.body)}</div></div>`).join('');
  }

  if(graded.length){
    h += `<h2>Production (${graded.length} graded game${graded.length===1?'':'s'})</h2>` + graded.slice(0,10).map(g => `
      <div class="row"><span style="min-width:58px;color:var(--dim)">${esc(g.date||'')}</span>
      <span style="min-width:40px;font-family:'Anton',sans-serif;font-size:16px;">${g.grade.toFixed(1)}</span>
      <span style="flex:1;color:#C4C4C4;">${esc(g.statLine||'')}</span></div>`).join('');
  }

  h += `<h2>Look him up</h2>${railHTML(p.name)}`;
  h += `<footer>Built by InHome Recruiting Intelligence. Grades come from evaluators watching film, not from a paid ranking.
        A blue check means InHome confirmed that measurable at the source. This page is private and was shared with you directly.</footer>`;

  document.getElementById('app').innerHTML = h;
  const uf = document.getElementById('unlockForm');
  if(uf) uf.addEventListener('submit', e => {
    e.preventDefault();
    const code = (document.getElementById('unlockCode').value || '').trim().toUpperCase();
    if(!code){ document.getElementById('unlockErr').textContent = 'Enter your access code.'; return; }
    try{ sessionStorage.setItem('ih_prog_code', code); }catch(err){}
    const u = new URL(location.href); u.searchParams.set('code', code); location.href = u.toString();
  });
  document.title = p.name + ' | InHome Prospect Profile';
}

(async function(){
  const id = QS.get('id'), name = QS.get('name');
  if(!id && !name){ document.getElementById('app').innerHTML = '<div class="empty"><div class="big">No player specified</div></div>'; return; }
  try{
    const q = id ? 'id=' + encodeURIComponent(id) : 'name=' + encodeURIComponent(name) + '&school=' + encodeURIComponent(QS.get('school')||'');
    let code = QS.get('code');
    if(!code){ try{ code = sessionStorage.getItem('ih_prog_code'); }catch(err){} }
    const qf = code ? q + '&code=' + encodeURIComponent(code) : q;
    const res = await fetch('/.netlify/functions/player?' + qf, { cache:'no-store' });
    const p = await res.json();
    if(!res.ok) throw new Error(p.error || 'Not found');
    render(p);
  }catch(err){
    document.getElementById('app').innerHTML = `<div class="empty"><div class="big">Profile not available</div><div class="sub">${esc(err.message)}</div></div>`;
  }
})();
</script>
</body>
</html>
