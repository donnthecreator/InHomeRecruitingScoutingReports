<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InHome | Scout Profile</title>
<meta property="og:title" content="InHome Scout Profile">
<meta property="og:description" content="Verified evaluator in the InHome scout network.">
<meta property="og:type" content="profile">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#FF0000; --red-deep:#170000;
    --paper:#0A0A0A; --card:#141414; --card-2:#1B1B1B;
    --ink:#F5F5F5; --line:#2A2A2A; --mute:#B4B4B4; --dim:#7A7A7A;
    --good:#35C759;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:#050505; color:var(--ink); font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.disp{font-family:'Anton',sans-serif; font-weight:400; letter-spacing:.02em; text-transform:uppercase;}
  a{color:inherit;}
  @media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important;} }
  :focus-visible{outline:2px solid var(--red); outline-offset:2px;}

  .sheet{max-width:680px; margin:0 auto; background:var(--paper); min-height:100vh;
    border-left:1px solid var(--line); border-right:1px solid var(--line);}

  /* ---------- TOP BAR ---------- */
  .topbar{background:#000; border-bottom:1px solid var(--line); padding:13px 20px; display:flex;
    align-items:center; justify-content:space-between; position:sticky; top:0; z-index:20;}
  .tb-logo{display:flex; align-items:center; gap:9px;}
  .tb-logo #tbMark{height:30px; width:auto; display:block;}
  .tb-word{font-family:'Anton',sans-serif; font-size:19px; letter-spacing:.03em;
    text-transform:lowercase; color:var(--ink); line-height:1;}
  .tb-word b{color:var(--red); font-weight:400;}
  .share-btn{background:var(--red); color:#fff; border:none; border-radius:8px; padding:8px 15px;
    font-family:'Inter',sans-serif; font-size:11.5px; font-weight:700; cursor:pointer; letter-spacing:.04em;
    text-transform:uppercase; display:flex; align-items:center; gap:6px;}
  .share-btn:hover{background:#E60000;}

  /* ---------- HERO ---------- */
  .hero{position:relative; overflow:hidden; border-bottom:1px solid var(--line);}
  .hero-bg{position:absolute; inset:0; background-size:cover; background-position:center 18%;
    filter:grayscale(.35) contrast(1.05); opacity:.5;}
  .hero-scrim{position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(5,5,5,.35) 0%, rgba(10,10,10,.82) 58%, var(--paper) 100%);}
  .hero-inner{position:relative; padding:28px 24px 22px; min-height:290px; display:flex;
    flex-direction:column; justify-content:flex-end;}
  .hero.nophoto .hero-inner{min-height:0; padding-top:26px;}

  .verified{display:inline-flex; align-items:center; gap:5px; background:var(--red-deep); border:1px solid var(--red);
    border-radius:20px; padding:4px 11px; font-size:9.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.08em; color:#FF6B6B; margin-bottom:12px; align-self:flex-start;}
  .verified .dot{width:5px; height:5px; border-radius:50%; background:var(--red);}

  .hero-row{display:flex; align-items:flex-end; gap:16px;}
  .hero-face{width:76px; height:76px; flex:0 0 auto; border-radius:12px; overflow:hidden;
    border:2px solid var(--red); background:var(--card-2); display:flex; align-items:center;
    justify-content:center; box-shadow:0 6px 22px rgba(0,0,0,.6);}
  .hero-face img{width:100%; height:100%; object-fit:cover; display:block;}
  .hero-face .ph-init{font-family:'Anton',sans-serif; font-size:28px; color:var(--dim);}
  .hero-id{flex:1; min-width:0;}
  .hero-name{font-size:38px; line-height:.96; margin:0; text-shadow:0 2px 18px rgba(0,0,0,.7);}
  .hero-role{font-size:12.5px; color:var(--ink); font-weight:600; margin-top:8px; letter-spacing:.01em;}
  .hero-loc{font-size:11.5px; color:var(--mute); margin-top:3px;}
  .photo-pending{font-size:9px; color:var(--dim); font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; margin-top:10px;}

  /* ---------- LEDGER STRIP ---------- */
  .ledger{display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--line);
    border-bottom:1px solid var(--line); background:#000;}
  .ledger div{padding:13px 10px; text-align:center; border-right:1px solid var(--line);}
  .ledger div:last-child{border-right:none;}
  .ledger .n{font-family:'Anton',sans-serif; font-size:24px; line-height:1; color:var(--red);}
  .ledger .l{font-size:8.5px; color:var(--mute); font-weight:700; text-transform:uppercase;
    letter-spacing:.1em; margin-top:6px; line-height:1.3;}

  /* ---------- BODY ---------- */
  .body{padding:24px 24px 40px;}
  .sec{margin-bottom:30px;}
  .sec-h{font-family:'Anton',sans-serif; font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--red); margin-bottom:5px;}
  .sec-sub{font-size:11px; color:var(--dim); margin-bottom:13px; padding-bottom:9px;
    border-bottom:1px solid var(--line); line-height:1.5;}

  /* ---------- THE PIPELINE (signature) ---------- */
  .pipe{display:flex; flex-direction:column;}
  .pipe-row{display:flex; align-items:baseline; gap:14px; padding:14px 0;
    border-bottom:1px solid #1C1C1C; position:relative;}
  .pipe-row:last-child{border-bottom:none;}
  .pipe-row::before{content:''; position:absolute; left:-24px; top:50%; width:12px; height:1px;
    background:var(--line);}
  .pipe-name{font-family:'Anton',sans-serif; font-size:17px; letter-spacing:.02em; line-height:1.1;
    flex:0 0 auto; max-width:52%;}
  .pipe-rule{flex:1; border-bottom:1px dotted #303030; transform:translateY(-4px); min-width:12px;}
  .pipe-dest{flex:0 0 auto; text-align:right; font-size:12px; font-weight:700; color:var(--mute);
    letter-spacing:.02em; line-height:1.35; max-width:44%;}
  .pipe-dest .pro{color:var(--red); display:block; font-family:'Anton',sans-serif; font-size:14px;
    font-weight:400; letter-spacing:.03em; text-transform:uppercase;}
  .pipe-dest .via{display:block; font-size:10px; color:var(--dim); font-weight:600; margin-top:2px;}

  /* ---------- FACTS ---------- */
  .fact-grid{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
  .fact{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 13px;}
  .fact .k{font-size:9.5px; color:var(--dim); font-weight:700; text-transform:uppercase; letter-spacing:.06em;}
  .fact .v{font-size:14px; color:var(--ink); font-weight:600; margin-top:4px; line-height:1.3;}

  .bio-text{font-size:14px; color:#E4E4E4; line-height:1.65;}

  /* ---------- ACCOLADE ---------- */
  .accolade{background:#000; border:1.5px solid var(--red); border-radius:12px; padding:15px 17px;
    display:flex; align-items:center; gap:14px; margin-bottom:30px;}
  .accolade .ac-ic{font-family:'Anton',sans-serif; font-size:22px; color:var(--red); flex:0 0 auto;}
  .accolade .ac-tx{font-size:13.5px; color:#fff; font-weight:600; line-height:1.4;}

  .chip-list{display:flex; flex-wrap:wrap; gap:7px;}
  .chip-item{background:var(--card-2); border:1.5px solid var(--line); border-radius:8px; padding:8px 13px;
    font-size:12.5px; font-weight:600; color:var(--ink);}

  .blurb-box{background:var(--card); border-left:3px solid var(--red); border-radius:0 10px 10px 0;
    padding:14px 16px; font-size:13.5px; color:#EDEDED; line-height:1.55; font-style:italic;}
  .blurb-lbl{font-size:9px; color:var(--dim); font-weight:700; text-transform:uppercase; letter-spacing:.1em;
    margin-bottom:7px; font-style:normal;}

  .contact-row{display:flex; flex-wrap:wrap; gap:10px;}
  .contact-item{display:flex; align-items:center; gap:9px; background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:11px 15px; text-decoration:none; color:var(--ink); font-size:13.5px;
    font-weight:600; transition:border-color .15s, background .15s;}
  .contact-item:hover{border-color:var(--red); background:var(--card-2);}
  .contact-item svg{width:17px; height:17px; color:var(--red); flex:0 0 auto;}

  .profile-cta{background:#000; border:1px solid var(--line); border-radius:14px; padding:20px;
    text-align:center; margin-top:8px;}
  .profile-cta .pc-h{font-family:'Anton',sans-serif; font-size:16px; text-transform:uppercase; letter-spacing:.02em;}
  .profile-cta .pc-s{font-size:12px; color:var(--dim); margin-top:5px; line-height:1.5;}

  .foot{background:#000; border-top:1px solid var(--line); padding:20px 24px; text-align:center;}
  .foot .m{font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); font-weight:700;}
  .foot .l{font-size:11px; color:var(--dim); margin-top:6px; font-style:italic;}

  .loading{text-align:center; padding:80px 20px; color:var(--dim); font-size:14px;}
  .notfound{text-align:center; padding:80px 24px;}
  .notfound .t{font-family:'Anton',sans-serif; font-size:22px; text-transform:uppercase; color:var(--mute);}
  .notfound .s{font-size:13px; color:var(--dim); margin-top:8px;}

  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(80px); background:#fff;
    color:#000; font-size:13px; font-weight:600; padding:11px 18px; border-radius:9px; z-index:60;
    transition:transform .25s;}
  .toast.show{transform:translateX(-50%) translateY(0);}

  @media (max-width:520px){
    .hero-name{font-size:31px;}
    .hero-inner{min-height:245px;}
    .fact-grid{grid-template-columns:1fr;}
    .pipe-row{flex-direction:column; align-items:flex-start; gap:4px;}
    .pipe-name{max-width:100%;}
    .pipe-rule{display:none;}
    .pipe-dest{text-align:left; max-width:100%;}
    .pipe-dest .pro{display:inline-block;}
  }
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="sheet">
  <div class="topbar">
    <div class="tb-logo">
      <!-- LOGO: upload your Roof Slot image to the repo root (same place as
           kmann_headshot.jpg), then set src below to its filename, e.g.
           src="/inhome-logo.png". Until then the wordmark beside it shows. -->
      <img id="tbMark" src="/inhome-logo.png" alt="" onerror="this.style.display='none'">
      <span class="tb-word">i<b>n</b>home</span>
    </div>
    <button class="share-btn" onclick="shareProfile()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      Share
    </button>
  </div>

  <div id="content"><div class="loading">Loading profile...</div></div>

  <div class="foot">
    <div class="m">Athlete&rsquo;s Inc+ &middot; InHome Scouting &middot; The Lab USA</div>
    <div class="l">The pipeline to the colleges.</div>
  </div>
</div>

<script>
/* =====================================================================
   scout.html?id=<scoutId>

   Reads one scout from /.netlify/functions/scout-profile and renders a
   shareable resume page. Built for one reader: a college Director of
   Player Personnel deciding whether this evaluator's reports are worth
   opening. So the page leads with where his players landed, not a bio.

   NOTE: if a field is populated in Neon but blank here, the fix is in
   scout-profile's SELECT list, not this file.
===================================================================== */

/* NFL clubs, used only to tier a destination as pro vs college. */
const PRO_CLUBS = ['Cardinals','Falcons','Ravens','Bills','Panthers','Bears','Bengals','Browns',
  'Cowboys','Broncos','Lions','Packers','Texans','Colts','Jaguars','Chiefs','Raiders','Chargers',
  'Rams','Dolphins','Vikings','Patriots','Saints','Giants','Jets','Eagles','Steelers','49ers',
  'Seahawks','Buccaneers','Titans','Commanders','NFL'];

function isPro(dest){
  return PRO_CLUBS.some(c => dest.indexOf(c) !== -1);
}

/* "Carlos Allen Jr. (Houston, Atlanta Falcons)" ->
   { name, dest:'Atlanta Falcons', via:'Houston', pro:true }            */
function parseDeveloped(entry){
  const m = entry.match(/^(.*?)\s*\((.*)\)\s*$/);
  if(!m) return { name: entry.trim(), dest:'', via:'', pro:false };
  const name = m[1].trim();
  const parts = m[2].split(',').map(x => x.trim()).filter(Boolean);
  const last = parts[parts.length - 1] || '';
  if(parts.length > 1 && isPro(last)){
    return { name, dest:last, via: parts.slice(0, -1).join(', '), pro:true };
  }
  return { name, dest: parts.join(', '), via:'', pro: isPro(last) };
}

function autoBlurb(s){
  if(s.blurb_override) return s.blurb_override;
  const bits = [];
  const pro = s.pro_experience && s.pro_experience.trim();
  const col = s.college && s.college.trim();
  const posWord = playPosWord(s.play_position);
  if(col && pro) bits.push(`Former ${col} and ${pro} ${posWord}`.trim());
  else if(col) bits.push(`Former ${col} ${posWord}`.trim());
  else if(pro) bits.push(`Former ${pro} ${posWord}`.trim());
  if(s.accolade && s.accolade.trim()){
    const ac = s.accolade.trim();
    const leadLetters = (ac.match(/^[A-Za-z]+/) || [''])[0];
    const isAcronym = leadLetters.length >= 2 && leadLetters.length <= 4 && leadLetters === leadLetters.toUpperCase();
    const acJoined = isAcronym ? ac : lowerFirst(ac);
    bits[0] = (bits[0] ? bits[0] + ', ' : '') + acJoined;
  }
  if(s.brand && s.brand.trim()){
    const role = s.brand_role ? s.brand_role + ' of ' : '';
    bits.push(`${role}${s.brand.trim()}`);
  }
  if(s.developed && s.developed.trim()){
    const first = parseDeveloped(s.developed.split(/,(?![^(]*\))/)[0]).name;
    bits.push(`has developed players including ${first}`);
  }
  let region = s.region && s.region.trim() && s.region !== 'Unassigned' ? s.region.trim() : '';
  const isNational = /national/i.test(region);
  const evalWord = scoutScope(s);
  if(evalWord){
    if(isNational) bits.push(`evaluates ${evalWord} nationally for InHome`);
    else bits.push(`evaluates ${evalWord}${region ? ' across ' + region : ''} for InHome`);
  } else if(region){
    bits.push(isNational ? 'scouts nationally for InHome' : `scouts ${region} for InHome`);
  }
  let out = bits.length ? cap(bits[0]) + '.' : '';
  if(bits.length > 1) out += ' ' + cap(bits.slice(1).join('; ')) + '.';
  return out;
}
function playPosWord(p){
  const map = {S:'safety', CB:'cornerback', DB:'defensive back', WR:'wide receiver',
    RB:'running back', QB:'quarterback', LB:'linebacker', EDGE:'edge rusher', TE:'tight end',
    OL:'offensive lineman', DL:'defensive lineman', DT:'defensive tackle'};
  return map[p] || (p ? p.toLowerCase() : 'player');
}
function scoutScope(s){
  const role = (s.role || '').toLowerCase();
  const pos = s.play_position || '';
  if(role.includes('db') || ['DB','S','CB'].indexOf(pos) > -1) return 'defensive backs';
  if(role.includes('wr') || pos === 'WR') return 'receivers';
  if(role.includes('dl') || role.includes('edge') || ['DL','EDGE','DT'].indexOf(pos) > -1) return 'defensive linemen and edge rushers';
  if(role.includes('lb') || pos === 'LB') return 'front-seven defenders';
  if(role.includes('rb') || pos === 'RB') return 'running backs';
  if(role.includes('ol') || pos === 'OL') return 'offensive linemen';
  return 'prospects';
}
function lowerFirst(x){ return x ? x.charAt(0).toLowerCase() + x.slice(1) : x; }
function cap(x){ return x ? x.charAt(0).toUpperCase() + x.slice(1) : x; }
function esc(s){ return String(s == null ? '' : s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function initials(n){ return (n || '?').split(' ').map(w => w[0]).filter(Boolean).slice(0,2).join('').toUpperCase(); }
function formatPhone(p){
  const d = String(p || '').replace(/[^0-9]/g, '');
  if(d.length === 10) return '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6);
  if(d.length === 11 && d[0] === '1') return '(' + d.slice(1,4) + ') ' + d.slice(4,7) + '-' + d.slice(7);
  return p;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}
function shareProfile(){
  const url = window.location.href;
  if(navigator.share){
    navigator.share({ title:'InHome Scout Profile', url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).then(() => toast('Profile link copied')).catch(() => toast(url));
  }
}

async function loadProfile(){
  const id = new URLSearchParams(location.search).get('id');
  const box = document.getElementById('content');
  if(!id){
    box.innerHTML = `<div class="notfound"><div class="t">No scout specified</div><div class="s">Add ?id=&lt;scout&gt; to the link.</div></div>`;
    return;
  }
  let s = null;
  try{
    const res = await fetch('/.netlify/functions/scout-profile?id=' + encodeURIComponent(id));
    if(res.ok) s = await res.json();
  }catch(e){ /* fall through */ }

  if(!s || !s.scout_id){
    box.innerHTML = `<div class="notfound"><div class="t">Profile not found</div><div class="s">This scout link isn&rsquo;t active yet.</div></div>`;
    return;
  }
  render(s);
}

function render(s){
  const box = document.getElementById('content');
  const name = s.name || 'Scout';
  const roleLine = [s.role, s.brand ? (s.brand_role ? s.brand_role + ', ' : '') + s.brand : null]
    .filter(Boolean).join(' \u00b7 ');
  const heroPhoto = s.hero_url || s.headshot_url || '';
  const facePhoto = s.headshot_url || s.hero_url || '';

  /* Split on commas that aren't inside parentheses. */
  const developed = (s.developed || '').split(/,(?![^(]*\))/)
    .map(x => x.trim()).filter(Boolean).map(parseDeveloped);
  const proCount = developed.filter(d => d.pro).length;
  const programs = (s.programs || '').split(',').map(x => x.trim()).filter(Boolean);

  /* Ledger: only cells with real numbers behind them. */
  const cells = [];
  if(developed.length) cells.push([developed.length, proCount ? 'Players developed' : 'Players placed']);
  if(proCount) cells.push([proCount, proCount === 1 ? 'In the NFL' : 'In the NFL']);
  if(s.reports_filed) cells.push([s.reports_filed, 'Reports filed']);
  if(cells.length < 3 && programs.length) cells.push([programs.length, 'Programs connected']);
  if(cells.length < 3 && s.years_active) cells.push([s.years_active, 'Years in the game']);

  const facts = [];
  if(s.college) facts.push(['Played At', s.college + (s.play_position ? ' \u00b7 ' + s.play_position : '')]);
  if(s.pro_experience) facts.push(['Pro', s.pro_experience]);
  if(s.region && s.region !== 'Unassigned') facts.push(['Covers', s.region]);
  if(s.hometown) facts.push(['Hometown', s.hometown]);
  if(s.role) facts.push(['InHome Role', s.role]);
  if(s.brand) facts.push(['Trains At', s.brand]);

  box.innerHTML = `
  <div class="hero ${heroPhoto ? '' : 'nophoto'}">
    ${heroPhoto ? `<div class="hero-bg" style="background-image:url('${esc(heroPhoto)}')"></div>
    <div class="hero-scrim"></div>` : ''}
    <div class="hero-inner">
      <div class="verified"><span class="dot"></span> Verified InHome Scout</div>
      <div class="hero-row">
        <div class="hero-face">
          ${facePhoto
            ? `<img src="${esc(facePhoto)}" alt="${esc(name)}">`
            : `<span class="ph-init">${initials(name)}</span>`}
        </div>
        <div class="hero-id">
          <h1 class="hero-name">${esc(name)}</h1>
          ${roleLine ? `<div class="hero-role">${esc(roleLine)}</div>` : ''}
          ${s.hometown ? `<div class="hero-loc">${esc(s.hometown)}</div>` : ''}
        </div>
      </div>
      ${facePhoto ? '' : '<div class="photo-pending">Photo pending</div>'}
    </div>
  </div>

  ${cells.length ? `<div class="ledger">
    ${cells.slice(0,3).map(([n,l]) => `<div><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`).join('')}
  </div>` : ''}

  <div class="body">
    ${s.accolade ? `<div class="accolade"><div class="ac-ic">&#9733;</div><div class="ac-tx">${esc(s.accolade)}</div></div>` : ''}

    ${developed.length ? `<div class="sec">
      <div class="sec-h">The Pipeline</div>
      <div class="sec-sub">Players ${esc(name.split(' ')[0])} has developed, and where they went.</div>
      <div class="pipe">
        ${developed.map(d => `<div class="pipe-row">
          <div class="pipe-name">${esc(d.name)}</div>
          <div class="pipe-rule"></div>
          <div class="pipe-dest">
            ${d.pro ? `<span class="pro">${esc(d.dest)}</span>` : esc(d.dest)}
            ${d.via ? `<span class="via">via ${esc(d.via)}</span>` : ''}
          </div>
        </div>`).join('')}
      </div>
    </div>` : ''}

    ${(s.evaluator || s.bio_evaluator) ? `<div class="sec">
      <div class="sec-h">How He Grades It</div>
      <div class="sec-sub">What this evaluator is looking at when the film rolls.</div>
      <div class="bio-text">${esc(s.evaluator || s.bio_evaluator)}</div>
    </div>` : ''}

    ${facts.length ? `<div class="sec">
      <div class="sec-h">The Background</div>
      <div class="sec-sub">&nbsp;</div>
      <div class="fact-grid">
        ${facts.map(([k,v]) => `<div class="fact"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('')}
      </div>
    </div>` : ''}

    ${s.bio ? `<div class="sec">
      <div class="sec-h">His Story</div>
      <div class="sec-sub">&nbsp;</div>
      <div class="bio-text">${esc(s.bio)}</div>
    </div>` : ''}

    ${programs.length ? `<div class="sec">
      <div class="sec-h">Connected Programs</div>
      <div class="sec-sub">Where he has played, coached, or placed players.</div>
      <div class="chip-list">
        ${programs.map(p => `<span class="chip-item">${esc(p)}</span>`).join('')}
      </div>
    </div>` : ''}

    <div class="sec">
      <div class="sec-h">On Every Report</div>
      <div class="sec-sub">&nbsp;</div>
      <div class="blurb-box"><div class="blurb-lbl">This summary rides on each EIS report ${esc(name.split(' ')[0])} files</div>${esc(autoBlurb(s))}</div>
    </div>

    ${(s.phone || s.instagram) ? `<div class="sec">
      <div class="sec-h">Get In Touch</div>
      <div class="sec-sub">&nbsp;</div>
      <div class="contact-row">
        ${s.phone ? `<a class="contact-item" href="tel:${esc(s.phone.replace(/[^0-9+]/g,''))}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <span>${esc(formatPhone(s.phone))}</span>
        </a>` : ''}
        ${s.instagram ? `<a class="contact-item" href="https://instagram.com/${esc(s.instagram.replace(/^@/,''))}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
          <span>@${esc(s.instagram.replace(/^@/,''))}</span>
        </a>` : ''}
      </div>
    </div>` : ''}

    <div class="profile-cta">
      <div class="pc-h">Eyes You Can Trust</div>
      <div class="pc-s">Every InHome evaluation is filed by a verified former player. No media rankings. Just film, and people who&rsquo;ve lived it.</div>
    </div>
  </div>`;

  document.title = 'InHome | ' + name;
}

loadProfile();
</script>
</body>
</html>
