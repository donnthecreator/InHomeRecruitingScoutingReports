<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>InHome Assessment</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --red:#FF0000; --paper:#000; --card:#111; --card-2:#171717; --line:#2A2A2A; --ink:#F5F5F5; --mute:#A0A0A0; --dim:#6A6A6A; --good:#35C759; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px; margin:0 auto; padding:0 18px 60px;}
  .top{display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--line);}
  .logo{font-family:'Anton',sans-serif; font-size:21px;}
  .logo b{color:var(--red); font-weight:400;}
  .logo small{display:block; font-family:'Inter',sans-serif; font-size:8px; letter-spacing:.22em; text-transform:uppercase; color:var(--dim); font-weight:700;}
  .who{text-align:right; font-size:12px; color:var(--mute);}
  .who b{display:block; color:var(--ink); font-size:14px;}

  .bar{position:sticky; top:0; z-index:20; background:#000; padding:10px 0 8px; border-bottom:1px solid var(--line);}
  .bar-track{height:4px; background:var(--card-2); border-radius:2px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--ink); width:0; transition:width .3s;}
  .bar-txt{font-size:11px; color:var(--dim); margin-top:6px; display:flex; justify-content:space-between;}

  h1{font-family:'Anton',sans-serif; font-weight:400; font-size:30px; margin:26px 0 8px; line-height:1.05;}
  .lede{color:#D0D0D0; font-size:15px; margin-bottom:6px;}
  .fine{color:var(--dim); font-size:12.5px;}

  .sec-title{font-family:'Anton',sans-serif; font-size:19px; margin:30px 0 4px;}
  .sec-count{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:700;}
  .q{border-top:1px solid var(--line); padding:20px 0;}
  .q-text{font-size:15.5px; font-weight:600; margin-bottom:12px; color:#FFF; line-height:1.4;}
  textarea, input[type=text]{width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid #3A3A3A; background:#1C1C1C; color:#EDEDED; font-size:16px; font-family:inherit;}
  textarea::placeholder, input::placeholder{color:#6E6E6E;}
  textarea{min-height:88px; resize:vertical;}
  textarea:focus, input:focus{outline:none; border-color:#FFF;}
  .opts{display:flex; flex-direction:column; gap:9px;}
  .opt{display:flex; gap:11px; align-items:flex-start; border:1.5px solid #3A3A3A; border-radius:10px;
       padding:14px 14px; cursor:pointer; font-size:15px; line-height:1.4; background:#1C1C1C; color:#EDEDED;
       text-align:left; font-family:inherit; width:100%; transition:border-color .12s, background .12s;}
  .opt:hover{border-color:#6F6F6F; background:#232323;}
  .opt.on{border-color:#FFF; background:#FFF; color:#000; font-weight:600;}
  .opt i{width:18px; height:18px; border-radius:50%; border:2px solid #7A7A7A; flex:0 0 auto; margin-top:1px; background:transparent;}
  .opt.on i{border-color:#000; background:#000; box-shadow:inset 0 0 0 3px #fff;}
  .scale{display:flex; gap:7px;}
  .scale button{flex:1; border:1.5px solid #3A3A3A; background:#1C1C1C; color:#EDEDED; border-radius:9px;
       padding:14px 0; font-family:'Anton',sans-serif; font-size:17px; cursor:pointer;}
  .scale button:hover{border-color:#6F6F6F;}
  .scale button.on{background:#FFF; border-color:#FFF; color:#000;}
  .scale-ends{display:flex; justify-content:space-between; font-size:11px; color:var(--dim); margin-top:5px;}

  .field{border:1px solid #2A2A2A; border-radius:12px; overflow:hidden; background:#0B1F12; margin-bottom:10px; position:relative;}
  .field svg{display:block; width:100%; height:auto;}
  .dot{cursor:pointer;}
  .dot .ring{fill:#1C1C1C; stroke:#E9E9E9; stroke-width:2.2;}
  .dot .tri{fill:#1C1C1C; stroke:#E9E9E9; stroke-width:2.2;}
  .dot:hover .ring, .dot:hover .tri{stroke:#FFF; stroke-width:3;}
  .dot.picked .ring, .dot.picked .tri{fill:#FFF;}
  .dot.right .ring, .dot.right .tri{fill:#35C759; stroke:#35C759;}
  .dot.wrong .ring, .dot.wrong .tri{fill:#FF4D4D; stroke:#FF4D4D;}
  .dot.reveal .ring, .dot.reveal .tri{stroke:#35C759; stroke-width:3.5; stroke-dasharray:4 3;}
  .off .ball{fill:#FFF;}
  .off text{fill:#000; font:700 11px 'Inter',sans-serif; text-anchor:middle; dominant-baseline:central; pointer-events:none;}
  .snapbar{display:flex; gap:8px; align-items:center; margin:-2px 0 10px;}
  .snapbtn{background:#FFF; color:#000; border:none; border-radius:9px; padding:10px 18px; font-family:'Anton',sans-serif; font-size:15px; letter-spacing:.06em; text-transform:uppercase; cursor:pointer;}
  .snapbtn.ghost{background:transparent; color:#EDEDED; border:1.5px solid #3A3A3A; font-family:'Inter',sans-serif; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:none; padding:9px 14px;}
  .snapbtn:disabled{opacity:.4;}
  .snaphint{font-size:12px; color:#8A8A8A;}
  .dot .ring, .dot .tri, .off circle, .off text{transition:none;}
  .verdict{border-radius:10px; padding:11px 13px; font-size:14px; margin-top:8px; display:none;}
  .verdict.ok{display:block; background:#0E2A19; border:1px solid #1E6B3A; color:#CFF5DB;}
  .verdict.no{display:block; background:#2A0E0E; border:1px solid #6B1E1E; color:#F5CFCF;}
  .verdict small{display:block; color:#BDBDBD; margin-top:4px; font-size:12.5px;}
  .locked .opt, .locked .dot{pointer-events:none;}
  .clip{border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:12px; background:var(--card);}
  .clip .vid{position:relative; padding-bottom:56.25%; height:0; background:#000;}
  .clip .vid iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .clip .body{padding:14px;}

  .save{position:fixed; left:0; right:0; bottom:0; background:rgba(0,0,0,.95); border-top:1px solid var(--line); padding:12px 18px calc(12px + env(safe-area-inset-bottom)); z-index:30;}
  .save .inner{max-width:640px; margin:0 auto; display:flex; gap:10px; align-items:center;}
  .btn{flex:1; background:var(--red); color:#fff; border:none; border-radius:12px; padding:15px; font-family:'Anton',sans-serif; font-size:17px; letter-spacing:.05em; text-transform:uppercase; cursor:pointer;}
  .btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line); flex:0 0 auto; padding:15px 18px; font-size:13px;}
  .btn:disabled{opacity:.45;}
  .status{font-size:12px; color:var(--dim); text-align:center; padding:8px 0 0;}
  .done{text-align:center; padding:70px 0;}
  .done .big{font-family:'Anton',sans-serif; font-size:38px; margin-bottom:10px;}
  .done p{color:#D0D0D0; max-width:30em; margin:0 auto 10px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="https://inhomerecruiting.com" style="display:block;"><img src="inhome-logo.png" alt="InHome Recruiting Intelligence" style="height:40px; width:auto; display:block;"></a>
    <div class="who" id="who"></div>
  </div>
  <div id="app"><div class="fine" style="padding:60px 0; text-align:center;">Loading...</div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s==null?'':s).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const QS = new URLSearchParams(location.search);
const TOKEN = QS.get('t') || '';
const PREVIEW = QS.get('preview') || '';
let DATA = null, ANSWERS = {}, DIRTY = false;

function totalQuestions(){
  let n = 0;
  (DATA.sections||[]).forEach(s => n += s.items.length);
  n += (DATA.clips||[]).length;
  n += (DATA.dots||[]).length;
  return n;
}
function answeredCount(){
  return Object.keys(ANSWERS).filter(k => { const v = ANSWERS[k]; return v !== '' && v !== null && v !== undefined; }).length;
}
function updateBar(){
  const t = totalQuestions(), a = Math.min(answeredCount(), t);
  const f = $('barFill'); if(f) f.style.width = (t ? (a/t*100) : 0) + '%';
  const x = $('barTxt'); if(x) x.textContent = a + ' of ' + t + ' answered';
}

function setAns(id, val){ ANSWERS[id] = val; DIRTY = true; updateBar(); }

function qHTML(it){
  const v = ANSWERS[it.id];
  if(it.type === 'single'){
    return `<div class="opts">${(it.options||[]).map((o,i)=>
      `<button type="button" class="opt ${String(v)===String(i)?'on':''}" data-q="${esc(it.id)}" data-v="${i}"><i></i><span>${esc(o)}</span></button>`).join('')}</div>`;
  }
  if(it.type === 'scale'){
    const max = it.max || 5;
    return `<div class="scale">${Array.from({length:max},(_,i)=>i+1).map(n=>
      `<button type="button" class="${String(v)===String(n)?'on':''}" data-q="${esc(it.id)}" data-v="${n}">${n}</button>`).join('')}</div>
      <div class="scale-ends"><span>${esc(it.low||'')}</span><span>${esc(it.high||'')}</span></div>`;
  }
  if(it.type === 'short'){
    return `<input type="text" data-q="${esc(it.id)}" value="${esc(v||'')}" autocomplete="off">`;
  }
  return `<textarea data-q="${esc(it.id)}" placeholder="Take your time. Specific beats long.">${esc(v||'')}</textarea>`;
}

/* The whiteboard. Offense labeled, defense unlabeled. Down linemen are
   triangles (in a stance), everyone else circles. */
function fieldSVG(sc){
  const W = 600, H = 340, LOS = 195;
  let g = '';
  for(let y = 25; y < H; y += 34) g += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#1E3A28" stroke-width="1"/>`;
  [200, 400].forEach(x => { for(let y = 20; y < H; y += 17) g += `<line x1="${x-4}" y1="${y}" x2="${x+4}" y2="${y}" stroke="#2A5039" stroke-width="1"/>`; });
  g += `<line x1="0" y1="${LOS}" x2="${W}" y2="${LOS}" stroke="#F5F5F5" stroke-width="1.5" stroke-dasharray="6 5" opacity=".7"/>`;
  const picked = ANSWERS['dot_'+sc.id];
  const defs = (sc.defense||[]).map(d => {
    const cls = ['dot', (sc.mode==='tap' && String(picked)===d.id) ? 'picked' : ''].filter(Boolean).join(' ');
    const shape = d.t === 'dl'
      ? `<polygon class="tri" points="${d.x},${d.y-13} ${d.x+13},${d.y+10} ${d.x-13},${d.y+10}"/>`
      : `<circle class="ring" cx="${d.x}" cy="${d.y}" r="12"/>`;
    return `<g class="${cls}" data-def="${d.id}" data-sc="${esc(sc.id)}" data-x="${d.x}" data-y="${d.y}">${shape}<circle class="hit" cx="${d.x}" cy="${d.y}" r="20" fill="transparent"/></g>`;
  }).join('');
  const offs = (sc.offense||[]).map(o => `<g class="off" data-off="${o.id}" data-sc="${esc(sc.id)}" data-x="${o.x}" data-y="${o.y}"><circle class="ball" cx="${o.x}" cy="${o.y}" r="12"/><text x="${o.x}" y="${o.y}">${esc(o.l)}</text></g>`).join('');
  const snap = sc.snap ? `<div class="snapbar"><button type="button" class="snapbtn" data-snap="${esc(sc.id)}">Snap</button><button type="button" class="snapbtn ghost" data-reset="${esc(sc.id)}" disabled>Reset</button><span class="snaphint">Watch the movement, then answer. Replay as many times as you want.</span></div>` : '';
  return `<div class="field" id="fld_${esc(sc.id)}"><svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${g}${defs}${offs}</svg></div>${snap}`;
}
/* Move dots from their pre-snap spot to sc.motion targets over sc.duration ms. */
function moveGroup(g, tx, ty, t){
  const x0 = +g.dataset.x, y0 = +g.dataset.y;
  const x = x0 + (tx - x0) * t, y = y0 + (ty - y0) * t;
  const tri = g.querySelector('.tri'); if(tri) tri.setAttribute('points', `${x},${y-13} ${x+13},${y+10} ${x-13},${y+10}`);
  g.querySelectorAll('circle').forEach(c => { c.setAttribute('cx', x); c.setAttribute('cy', y); });
  const tx2 = g.querySelector('text'); if(tx2){ tx2.setAttribute('x', x); tx2.setAttribute('y', y); }
}
function snapPlay(scId){
  const sc = (DATA.dots||[]).find(x => x.id === scId); if(!sc || !sc.motion) return;
  const fld = document.getElementById('fld_' + scId); if(!fld) return;
  const btn = document.querySelector(`[data-snap="${scId}"]`), rst = document.querySelector(`[data-reset="${scId}"]`);
  if(btn) btn.disabled = true;
  const targets = Object.entries(sc.motion).map(([id, to]) => {
    const g = fld.querySelector(`[data-def="${id}"]`) || fld.querySelector(`[data-off="${id}"]`);
    return g ? { g, to } : null;
  }).filter(Boolean);
  const dur = sc.duration || 800, t0 = performance.now();
  const ease = (t) => t < .5 ? 2*t*t : -1 + (4 - 2*t) * t;
  const step = (now) => {
    const t = Math.min(1, (now - t0) / dur);
    targets.forEach(({g, to}) => moveGroup(g, to.x, to.y, ease(t)));
    if(t < 1) requestAnimationFrame(step); else { if(rst) rst.disabled = false; }
  };
  requestAnimationFrame(step);
}
function snapReset(scId){
  const sc = (DATA.dots||[]).find(x => x.id === scId); if(!sc || !sc.motion) return;
  const fld = document.getElementById('fld_' + scId); if(!fld) return;
  Object.keys(sc.motion).forEach(id => { const g = fld.querySelector(`[data-def="${id}"]`) || fld.querySelector(`[data-off="${id}"]`); if(g) moveGroup(g, +g.dataset.x, +g.dataset.y, 1); });
  const btn = document.querySelector(`[data-snap="${scId}"]`), rst = document.querySelector(`[data-reset="${scId}"]`);
  if(btn) btn.disabled = false; if(rst) rst.disabled = true;
}
function dotVerdict(sc, ok, given){
  const box = document.getElementById('dv_' + sc.id);
  const q = document.getElementById('dq_' + sc.id);
  if(!box) return;
  box.className = 'verdict ' + (ok ? 'ok' : 'no');
  box.innerHTML = (ok ? '<b>That\'s it.</b>' : '<b>Not that one.</b>') + (sc.why ? `<small>${esc(sc.why)}</small>` : '');
  if(q){
    q.classList.add('locked');
    if(!ok && sc.mode === 'tap'){ const el = q.querySelector(`[data-def="${sc.answer}"]`); if(el) el.classList.add('reveal'); }
  }
}
function keyHTML(it){
  if(!DATA.preview || !DATA.admin) return '';
  const bits = [];
  if(it.answer !== undefined && it.options) bits.push('Answer: ' + (it.answer+1) + '. ' + it.options[it.answer]);
  if(it.why) bits.push(it.why);
  if(it.mb) bits.push('Personality dimension: ' + it.mb);
  return bits.length ? `<div class="fine" style="margin-top:8px;color:#E0A419;">${esc(bits.join(' \u2014 '))}</div>` : '';
}
function render(){
  const isIQ = DATA.kind === 'iq';
  const isFull = DATA.kind === 'full';
  $('who').innerHTML = `<b>${esc(DATA.athlete||'')}</b>${esc(DATA.school||'')}`;
  const clipOpts = (c) => `<div class="opts">${(c.options||[]).map((o,i)=>
    `<button type="button" class="opt ${String(ANSWERS['clip_'+c.id])===String(i)?'on':''}" data-q="clip_${c.id}" data-v="${i}"><i></i><span>${esc(o)}</span></button>`).join('')}</div>`;

  $('app').innerHTML = `
    <div class="bar"><div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
      <div class="bar-txt"><span id="barTxt"></span><span id="saveState"></span></div></div>

    ${DATA.preview ? `<div style="background:#1A1206;border:1px solid #4A3410;border-radius:10px;padding:12px 14px;margin-top:16px;">
      <b style="color:#E0A419;">Preview</b> <span class="fine">— ${esc(DATA.kind)} version${DATA.positionGroup?', '+esc(DATA.positionGroup)+' module':', core only'}, ${totalQuestions()} questions. Nothing you type here is saved and no athlete sees this page.${DATA.admin?' Correct answers are shown because you are signed into admin.':' Sign into admin first to see the answer key.'}</span>
    </div>` : ''}
    <h1>${isIQ ? 'Football IQ Assessment' : isFull ? 'InHome Athlete Assessment' : 'InHome Athlete Interview'}</h1>
    <p class="lede">${isIQ
      ? 'Some of this is multiple choice, some of it is film. Watch each clip and tell us what you see. There is no time limit and you can leave and come back.'
      : isFull
      ? 'Two parts. First we ask about you: how you are wired, how you take coaching, what drives you. Then the football: written questions, live reads on a whiteboard where you tap the defender, and real film you diagnose. No time limit, and you can leave and come back.'
      : 'These are the questions a college coach would ask you sitting at your kitchen table. Answer them straight. The ones that sound uncomfortable are the ones that help you most.'}</p>
    <p class="fine">${isIQ || isFull
      ? 'On the football questions, answer without looking anything up. A wrong answer you reasoned through is worth more to us than a right one you searched.'
      : 'Nobody is grading your grammar. Type the way you talk.'} Your answers save as you go.</p>

    ${(DATA.sections||[]).map(sec => `
      <div class="sec-title">${esc(sec.section)}</div>
      <div class="sec-count">${sec.items.length} question${sec.items.length===1?'':'s'}</div>
      ${sec.items.map(it => `<div class="q"><div class="q-text">${esc(it.q)}</div>${qHTML(it)}${keyHTML(it)}</div>`).join('')}
    `).join('')}

    ${(DATA.dots||[]).length ? `
      <div class="sec-title">Live reads</div>
      <div class="sec-count">${DATA.dots.length} looks &middot; the offense is labeled, the defense is not &middot; you get the answer right away</div>
      ${DATA.dots.map((sc, n) => `
        <div class="q" id="dq_${esc(sc.id)}">
          <div class="q-text">${n+1}. ${esc(sc.q)}</div>
          ${fieldSVG(sc)}
          ${sc.mode === 'choice' ? `<div class="opts">${(sc.options||[]).map((o,i)=>`<button type="button" class="opt ${String(ANSWERS['dot_'+sc.id])===String(i)?'on':''}" data-dot="${esc(sc.id)}" data-v="${i}"><i></i><span>${esc(o)}</span></button>`).join('')}</div>`
                                : `<div class="fine">${sc.snap ? 'Hit Snap, then tap a defender on the field.' : 'Tap a defender on the field.'}</div>`}
          <div class="verdict" id="dv_${esc(sc.id)}"></div>
        </div>`).join('')}
    ` : ''}

    ${(DATA.clips||[]).length ? `
      <div class="sec-title">Film</div>
      <div class="sec-count">${DATA.clips.length} clip${DATA.clips.length===1?'':'s'} &middot; watch as many times as you need</div>
      ${DATA.clips.map(c => `
        <div class="q">
          <div class="clip">
            <div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${esc(c.youtubeId)}?rel=0&modestbranding=1${c.start?'&start='+c.start:''}" title="Film clip" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
            <div class="body"><div class="q-text" style="margin:0;">${esc(c.question)}</div></div>
          </div>
          ${clipOpts(c)}
          ${(DATA.preview && DATA.admin && c.answer!=null) ? `<div class="fine" style="margin-top:8px;color:#E0A419;">Answer: ${c.answer+1}. ${esc((c.options||[])[c.answer]||'')}${c.why?' \u2014 '+esc(c.why):''}</div>` : ''}
        </div>`).join('')}
    ` : ''}

    <div style="height:90px;"></div>
    ${DATA.preview ? '<div class="fine" style="text-align:center;padding:20px 0 40px;">End of preview. Close this tab when you are done.</div>' : ''}
    <div class="save" ${DATA.preview?'style="display:none;"':''}><div class="inner">
      <button type="button" class="btn ghost" onclick="saveNow(false)">Save</button>
      <button type="button" class="btn" id="submitBtn" onclick="submitAll()">Submit</button>
    </div><div class="status" id="statusLine"></div></div>`;

  document.querySelectorAll('[data-snap]').forEach(el => el.addEventListener('click', () => snapPlay(el.dataset.snap)));
  document.querySelectorAll('[data-reset]').forEach(el => el.addEventListener('click', () => snapReset(el.dataset.reset)));
  document.querySelectorAll('[data-def]').forEach(el => {
    el.addEventListener('click', () => {
      const sc = (DATA.dots||[]).find(x => x.id === el.dataset.sc); if(!sc || sc.mode !== 'tap') return;
      const q = document.getElementById('dq_' + sc.id); if(q && q.classList.contains('locked')) return;
      setAns('dot_' + sc.id, el.dataset.def);
      const ok = el.dataset.def === sc.answer;
      el.classList.add(ok ? 'right' : 'wrong');
      dotVerdict(sc, ok, el.dataset.def);
    });
  });
  document.querySelectorAll('[data-dot]').forEach(el => {
    el.addEventListener('click', () => {
      const sc = (DATA.dots||[]).find(x => x.id === el.dataset.dot); if(!sc) return;
      const q = document.getElementById('dq_' + sc.id); if(q && q.classList.contains('locked')) return;
      setAns('dot_' + sc.id, el.dataset.v);
      el.parentElement.querySelectorAll('.opt').forEach(b => b.classList.toggle('on', b === el));
      dotVerdict(sc, String(el.dataset.v) === String(sc.answer), el.dataset.v);
    });
  });
  document.querySelectorAll('[data-q]').forEach(el => {
    if(el.tagName === 'BUTTON'){
      el.addEventListener('click', () => {
        setAns(el.dataset.q, el.dataset.v);
        const grp = el.parentElement;
        grp.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el));
      });
    } else {
      el.addEventListener('input', () => setAns(el.dataset.q, el.value));
    }
  });
  updateBar();
}

async function saveNow(quiet){
  if(!DIRTY && quiet) return;
  const st = $('saveState');
  try{
    await fetch('/.netlify/functions/assessment', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ t: TOKEN, answers: ANSWERS }) });
    DIRTY = false;
    if(st) st.textContent = 'Saved';
    setTimeout(()=>{ if(st && !DIRTY) st.textContent = ''; }, 2000);
  }catch(e){ if(st) st.textContent = 'Not saved, check your signal'; }
}
setInterval(()=>saveNow(true), 20000);
window.addEventListener('beforeunload', (e) => { if(DIRTY){ e.preventDefault(); e.returnValue = ''; } });

async function submitAll(){
  const t = totalQuestions(), a = answeredCount();
  if(a < t && !confirm(`You have answered ${a} of ${t}. Submit anyway? You will not be able to change it after.`)) return;
  const btn = $('submitBtn'); btn.disabled = true; btn.textContent = 'Sending...';
  try{
    const res = await fetch('/.netlify/functions/assessment', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ t: TOKEN, answers: ANSWERS, done: true }) });
    const d = await res.json();
    if(!res.ok) throw new Error(d.error || 'Something went wrong');
    DIRTY = false;
    $('app').innerHTML = `<div class="done">
      <div class="big">Sent.</div>
      <p>Thanks${DATA.athlete ? ', ' + esc(DATA.athlete.split(' ')[0]) : ''}. An InHome evaluator reads every one of these himself.</p>
      <p class="fine">${d.scored ? 'Your film and multiple-choice answers are scored automatically. The written ones are read by a person, and those matter more.' : 'Nothing here is auto-scored. A person reads all of it.'}</p>
    </div>`;
    window.scrollTo({top:0, behavior:'smooth'});
  }catch(err){
    btn.disabled = false; btn.textContent = 'Submit';
    $('statusLine').textContent = err.message;
  }
}

(async function(){
  if(!TOKEN && !PREVIEW){ $('app').innerHTML = '<div class="done"><div class="big">Missing link key</div><p>Ask InHome for a fresh link.</p></div>'; return; }
  try{
    let adminTok = null;
    try{ adminTok = sessionStorage.getItem('inhome_admin_token'); }catch(e){}
    const url = PREVIEW ? '/.netlify/functions/assessment?preview=' + encodeURIComponent(PREVIEW) + (QS.get('position') ? '&position=' + encodeURIComponent(QS.get('position')) : '')
                        : '/.netlify/functions/assessment?t=' + encodeURIComponent(TOKEN);
    const res = await fetch(url, adminTok ? { headers:{ 'Authorization':'Bearer ' + adminTok } } : undefined);
    const d = await res.json();
    if(!res.ok) throw new Error(d.error || 'This link is not valid');
    DATA = d; ANSWERS = d.answers || {};
    if(d.status === 'complete'){
      $('app').innerHTML = '<div class="done"><div class="big">Already submitted</div><p>This one is in. If you need to change something, tell whoever sent you the link.</p></div>';
      return;
    }
    render();
  }catch(err){
    $('app').innerHTML = `<div class="done"><div class="big">Link not valid</div><p>${esc(err.message)}</p></div>`;
  }
})();
</script>
